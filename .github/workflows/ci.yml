name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run validate
      # Includes the real-runtime suite: the bundled Copilot runtime driven by a scripted model.
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_SCREENSHOTS: screenshots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: screenshots/

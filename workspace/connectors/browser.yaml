id: browser
name: Browser
description: A real Chromium browser on your shared computer (Playwright MCP). Sign-ins persist across your bots, like a shared desktop.
type: stdio
command: npx
args:
  - "-y"
  - "@playwright/mcp@0.0.83"
  - "--headless"
  - "--user-data-dir"
  - "${user.computerDir}/.browser-profile"
timeoutMs: 120000
# The browser runs on the platform host and can reach whatever the host can reach. Grant it
# explicitly (users/orgs) and restrict egress at the network layer before opening it up.
access:
  users: []
requireApproval: writes
